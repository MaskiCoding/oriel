[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package]
name = "oriel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ax = { version = "0.1.0", path = "crates/ax" }
block2 = "0.6"
capture = { version = "0.1.0", path = "crates/capture" }
dispatch2 = "0.3.1"
input = { version = "0.1.0", path = "crates/input" }
model = { version = "0.1.0", path = "crates/model" }
muda = { version = "0.19", default-features = false }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSBitmapImageRep", "NSResponder", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace", "libc"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSData", "NSDictionary", "NSError", "NSNotification", "NSString"] }
png = "0.18"
tray-icon = { version = "0.24", default-features = false }
ui = { version = "0.1.0", path = "crates/ui" }
winsrv = { path = "crates/winsrv" }

[dev-dependencies]
skylight-sys = { path = "crates/skylight-sys" }
