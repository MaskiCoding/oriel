[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["CAAnimation", "CALayer", "CAMediaTiming", "objc2-core-graphics"] }

[dependencies.objc2-foundation]
version = "0.3.2"
features = ["NSArray", "NSString", "NSGeometry", "NSValue"]

[dependencies.objc2-app-kit]
version = "0.3.2"
features = [
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "libc",
]
